<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="vinylSheen" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="45%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a4a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a4a4a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- outer vinyl body -->
  <circle cx="100" cy="100" r="98" fill="url(#vinylSheen)"/>
  <circle cx="100" cy="100" r="98" fill="url(#edgeHighlight)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#000" stroke-width="1" opacity="0.6"/>

  <!-- grooves (concentric rings) -->
  <g fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="0.6">
    <circle cx="100" cy="100" r="92"/>
    <circle cx="100" cy="100" r="86"/>
    <circle cx="100" cy="100" r="80"/>
    <circle cx="100" cy="100" r="74"/>
    <circle cx="100" cy="100" r="68"/>
    <circle cx="100" cy="100" r="62"/>
    <circle cx="100" cy="100" r="56"/>
    <circle cx="100" cy="100" r="50"/>
    <circle cx="100" cy="100" r="44"/>
  </g>
  <g fill="none" stroke="#565656" stroke-opacity="0.25" stroke-width="0.4">
    <circle cx="100" cy="100" r="89"/>
    <circle cx="100" cy="100" r="83"/>
    <circle cx="100" cy="100" r="77"/>
    <circle cx="100" cy="100" r="71"/>
    <circle cx="100" cy="100" r="65"/>
    <circle cx="100" cy="100" r="59"/>
    <circle cx="100" cy="100" r="53"/>
    <circle cx="100" cy="100" r="47"/>
  </g>

  <!-- label ring -->
  <circle cx="100" cy="100" r="40" fill="#000" opacity="0.15"/>

  <!-- white center label -->
  <circle cx="100" cy="100" r="38" fill="#f5f5f2"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="#c9c9c4" stroke-width="1"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#d8d8d3" stroke-width="0.6"/>

  <!-- spindle hole -->
  <circle cx="100" cy="100" r="3.2" fill="#0a0a0a"/>
</svg>
